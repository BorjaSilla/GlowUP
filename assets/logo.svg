<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- GlowUp · el orbe partido: a la izquierda tu web hoy (contorno), a la derecha su glow up (luz). En medio, el tirador del comparador. -->
  <defs>
    <radialGradient id="gu-bg" cx="30%" cy="18%" r="95%">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset=".55" stop-color="#151517"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="gu-o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc27d"/>
      <stop offset=".5" stop-color="#ff6a2a"/>
      <stop offset="1" stop-color="#e03d0a"/>
    </linearGradient>
    <clipPath id="gu-r"><rect x="32" y="0" width="32" height="64"/></clipPath>
    <clipPath id="gu-l"><rect x="0" y="0" width="32" height="64"/></clipPath>
    <filter id="gu-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#gu-bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="17.25" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
  <circle cx="34" cy="32" r="17" fill="#ff6a2a" opacity=".55" clip-path="url(#gu-r)" filter="url(#gu-glow)"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="2.2" clip-path="url(#gu-l)"/>
  <circle cx="32" cy="32" r="16.1" fill="url(#gu-o)" clip-path="url(#gu-r)"/>
  <rect x="30.8" y="11" width="2.4" height="42" rx="1.2" fill="#fff"/>
  <circle cx="32" cy="32" r="4.8" fill="#fff"/>
  <circle cx="32" cy="32" r="1.6" fill="#ff6a2a"/>
</svg>
